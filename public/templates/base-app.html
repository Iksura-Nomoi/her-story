<div class="window-header">
    <div class="window-title">{{title}}</div>
    <div class="window-controls">
        <button class="win-btn minimize" aria-label="Minimize">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="4" y1="12" x2="20" y2="12"></line></svg>
        </button>
        <button class="win-btn maximize" aria-label="Maximize">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg>
        </button>
        <button class="win-btn close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>
</div>
<div class="window-content">
</div>
<div class="resize-handle resize-n" data-dir="n"></div>
<div class="resize-handle resize-s" data-dir="s"></div>
<div class="resize-handle resize-e" data-dir="e"></div>
<div class="resize-handle resize-w" data-dir="w"></div>
<div class="resize-handle resize-ne" data-dir="ne"></div>
<div class="resize-handle resize-nw" data-dir="nw"></div>
<div class="resize-handle resize-se" data-dir="se"></div>
<div class="resize-handle resize-sw" data-dir="sw"></div>
